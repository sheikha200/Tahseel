<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tahseel | Register</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .register-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        .register-container h2 { color: #1f3c88; margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-register { background-color: #1f3c88; color: white; padding: 12px; border: none; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; font-size: 16px; }
        .btn-register:hover { background-color: #2c5cc5; }
        .back-link { display: block; margin-top: 15px; color: #666; text-decoration: none; font-size: 14px; }
        .flash-messages { color: #dc3545; font-size: 14px; margin-bottom: 10px; list-style: none; padding: 0; }
    </style>
</head>
<body>

    <div class="register-container">
        <h2>Create Account</h2>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <ul class="flash-messages">
            {% for message in messages %}
              <li>{{ message }}</li>
            {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}

        <form action="/register" method="POST">
            <input type="text" name="fullname" placeholder="Full Name" required>
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password (Min 6 chars + Number)" required>
            
            <label style="display:block; text-align:left; margin-top:10px; color:#555;">I am a:</label>
            <select name="role">
                <option value="student">Student</option>
                <option value="admin">Instructor (Admin)</option>
            </select>
            
            <button type="submit" class="btn-register">Register Now</button>
        </form>
        
        <a href="/" class="back-link">Already have an account? Login</a>
    </div>

</body>
</html>
