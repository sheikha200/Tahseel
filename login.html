<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tahseel | Secure Login</title>
    <style>

        .logo { width: 190px; margin-bottom: 15px;}
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f4f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 380px; text-align: center; border-top: 8px solid #1f3c88; }
        .login-card h1 { color: #1f3c88; margin-bottom: 5px; font-size: 28px; }
        .login-card p { color: #666; margin-bottom: 25px; font-size: 14px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-login { background-color: #1f3c88; color: white; padding: 12px; border: none; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        .btn-login:hover { background-color: #4a90e2; }
        .register-link { display: block; margin-top: 20px; color: #4a90e2; text-decoration: none; font-size: 14px; font-weight: bold; }
        .flash-msg { color: #dc3545; background: #fff5f5; padding: 10px; border-radius: 5px; margin-bottom: 15px; font-size: 13px; }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="\static\logo.jpeg.jpeg" alt="Tahseel Logo" class="logo">
        <p>Secure Exam Access System</p>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="flash-msg">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn-login">Login</button>
        </form>
        
        <a href="/register" class="register-link">Don't have an account? Register here</a>
    </div>

</body>
</html>
